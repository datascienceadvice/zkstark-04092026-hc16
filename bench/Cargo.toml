[package]
name = "bench"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "bench"
path = "src/main.rs"

[dependencies]
zkstark-core = { path = "../core" }
methods = { path = "../methods" }
risc0-zkvm = { version = "^2.3.2" }
rusqlite = { version = "0.31", features = ["bundled"] }
csv = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }